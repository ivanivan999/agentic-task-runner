name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Verify production builds
        run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build container images
        run: docker compose build

      - name: Smoke-test containers
        run: |
          set -e

          cleanup() {
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose up -d

          ready=false

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              --connect-timeout 3 \
              http://localhost:5173/api/tools; then
              ready=true
              break
            fi

            echo "Waiting for services... (${attempt}/20)"
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Services did not become ready."
            docker compose logs --no-color
            exit 1
          fi

          echo "Docker smoke test passed."
