name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Verify production builds
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build container images
        run: docker compose build

      - name: Smoke-test containers
        run: |
          docker compose up -d
          curl --fail --retry 10 --retry-connrefused http://localhost:5173/
          curl --fail --retry 10 --retry-connrefused http://localhost:5173/api/tools
          docker compose down
