apiVersion: apps/v1
kind: Deployment
metadata:
  name: french-study-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: french-study-mcp
  template:
    metadata:
      labels:
        app: french-study-mcp
    spec:
      containers:
        - name: mcp
          image: acrfrenchivanyu20260821.azurecr.io/french-study-lab:v1
          imagePullPolicy: Always
          command: ["npm", "run", "mcp:start"]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: french-lab-config
            - secretRef:
                name: french-lab-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: french-study-mcp
spec:
  type: ClusterIP
  selector:
    app: french-study-mcp
  ports:
    - name: http
      port: 3001
      targetPort: http
